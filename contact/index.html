<style>
  body { background: var(--paper-2); min-height: 100vh; min-height: 100dvh; }
  .card {
    max-width: 440px;
    margin: 0 auto;
    padding: clamp(2rem, 6vw, 3.5rem) 16px 2.5rem;
    display: flex; flex-direction: column; gap: 1.75rem;
  }
  .langs { display: flex; justify-content: center; gap: 2px; }
  .langs button {
    font-family: var(--f-mono); font-size: var(--t-2xs); font-weight: 500;
    letter-spacing: .13em; text-transform: uppercase;
    padding: .4rem .7rem; border: 1px solid var(--rule-2); color: var(--ink-2);
    background: var(--paper);
  }
  .langs button:first-child { border-radius: var(--r) 0 0 var(--r); }
  .langs button:last-child  { border-radius: 0 var(--r) var(--r) 0; }
  .langs button[aria-pressed="true"] { background: var(--violet); border-color: var(--violet); color: #fff; }

  .head { text-align: center; display: flex; flex-direction: column; align-items: center; gap: .6rem; }
  .head img { width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--paper); box-shadow: 0 0 0 1px var(--rule-2); }
  .head h1 { font-size: var(--t-2xl); }
  .head p { color: var(--ink-2); font-size: var(--t-sm); }

  .links { display: flex; flex-direction: column; gap: .6rem; }
  .lk {
    display: flex; align-items: center; gap: .9rem;
    padding: .95rem 1.1rem;
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: var(--r-lg);
    transition: border-color var(--d) var(--e-out), transform var(--d) var(--e-out);
  }
  .lk:hover { border-color: var(--violet); transform: translateY(-1px); }
  .lk__ic {
    width: 40px; height: 40px; flex: 0 0 auto; border-radius: var(--r);
    display: grid; place-items: center;
    background: var(--violet-wash); color: var(--violet);
  }
  .lk__ic .ic { width: 20px; height: 20px; }
  .lk span { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
  .lk b { font-weight: 600; font-size: var(--t-base); }
  .lk i { font-style: normal; font-size: var(--t-xs); color: var(--ink-3); }
  .lk__go { margin-left: auto; color: var(--ink-3); }
  .lk--main { background: var(--violet); border-color: var(--violet); color: #fff; }
  .lk--main .lk__ic { background: rgba(255,255,255,.14); color: #fff; }
  .lk--main i, .lk--main .lk__go { color: rgba(255,255,255,.75); }
  .lk--main:hover { border-color: var(--violet-deep); background: var(--violet-deep); }
  .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

  .info { display: flex; flex-direction: column; gap: .45rem; padding: 0 .25rem; color: var(--ink-2); font-size: var(--t-sm); }
  .info div { display: flex; align-items: center; gap: .6rem; }
  .info .ic { color: var(--violet); }

  .foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 0 .25rem; }
  .foot a { color: var(--violet); font-size: var(--t-sm); font-weight: 500; display: inline-flex; align-items: center; gap: .35rem; }
  .foot a:hover { text-decoration: underline; }
</style>
</head>
<body>

<script>
(function () {
  var T = {
    kaa: { sub: 'Nemis tili orayı · Nókis', ig: 'Nátiyjeler hám videolar', call: 'Qońıraw etiw',
           addr: 'Nókis qalası, 23-mikrorayon, 6', hours: 'Dú–Ju 09:00–20:00 · Sh 09:00–15:00',
           save: 'Kontakttı saqlaw', site: 'Saytqa ótiw', home: '../' },
    uz:  { sub: 'Nemis tili markazi · Nukus', ig: 'Natijalar va videolar', call: "Qo'ng'iroq qilish",
           addr: 'Nukus shahri, 23-mikrorayon, 6', hours: 'Du–Ju 09:00–20:00 · Sh 09:00–15:00',
           save: 'Kontaktni saqlash', site: "Saytga o'tish", home: '../uz/' },
    ru:  { sub: 'Центр немецкого языка · Нукус', ig: 'Результаты и видео', call: 'Позвонить',
           addr: 'г. Нукус, 23-й микрорайон, 6', hours: 'Пн–Пт 09:00–20:00 · Сб 09:00–15:00',
           save: 'Сохранить контакт', site: 'Перейти на сайт', home: '../ru/' }
  };
  function set(l, remember) {
    if (!T[l]) l = 'kaa';
    var d = T[l];
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = d[el.getAttribute('data-t')]; });
    document.querySelector('[data-home]').setAttribute('href', d.home);
    document.querySelectorAll('[data-set]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-set') === l)); });
    if (remember) { try { localStorage.setItem('berlin.lang', l); } catch (e) {} }
  }
  document.querySelectorAll('[data-set]').forEach(function (b) {
    b.addEventListener('click', function () { set(b.getAttribute('data-set'), true); });
  });
  var l = 'kaa';
  try { l = localStorage.getItem('berlin.lang') || (navigator.language || '').toLowerCase().slice(0, 2); } catch (e) {}
  set(l, false);
})();
</script>
