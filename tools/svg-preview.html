<!DOCTYPE html>
<meta charset="utf-8">
<title>SVG preview</title>
<style>
  body { margin:0; background:#fff; font:14px/1.4 system-ui; display:flex; gap:40px; padding:40px; align-items:flex-start; }
  figure { margin:0; }
  figcaption { font-family:monospace; font-size:12px; color:#888; margin-top:10px; }
  .chk { background:
    linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);
    background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0px; }
  img { display:block; }
</style>
<figure><img class="chk" src="../assets/brandenburg.svg" width="420"><figcaption>brandenburg.svg @420</figcaption></figure>
<figure><img class="chk" src="../assets/brandenburg.svg" width="160"><figcaption>@160</figcaption></figure>
<figure><img class="chk" src="../assets/sprechen.svg" width="320"><figcaption>sprechen.svg @320</figcaption></figure>
